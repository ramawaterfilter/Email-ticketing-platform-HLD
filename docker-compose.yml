services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desk}
      POSTGRES_DB: desk
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped # must come back after a reboot, or the API has no database

  # The two services below only start with:  docker compose --profile app up -d --build
  # For day-to-day development just run the database:  docker compose up -d db
  api:
    profiles: ["app"]
    build: ./backend
    image: support-desk-backend # api and worker share one image, so the backend builds once
    env_file: .env
    environment:
      DESK_DATABASE_URL: postgresql+psycopg://desk:${POSTGRES_PASSWORD:-desk}@db:5432/desk
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host's native Ollama on :11434
    depends_on:
      db:
        condition: service_healthy
    healthcheck: # "healthy" = migrations done, API answering, database reachable
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: support-desk-backend # reuses the image api builds (no second build)
    command: ["python", "-m", "app.worker"] # syncs mailboxes every 60s + nightly reconciliation
    env_file: .env
    environment:
      DESK_DATABASE_URL: postgresql+psycopg://desk:${POSTGRES_PASSWORD:-desk}@db:5432/desk
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the host's native Ollama on :11434
    depends_on:
      api:
        condition: service_healthy # api applies migrations first
    restart: unless-stopped

  web:
    profiles: ["app"]
    build: ./frontend
    environment:
      DESK_SITE_ADDRESS: ${DESK_SITE_ADDRESS:-:80}
    ports:
      # Defaults preserve the public-VM behaviour: 0.0.0.0:80 + 0.0.0.0:443, Caddy terminates HTTPS.
      # Behind a reverse proxy that terminates TLS (e.g. Tailscale Serve), bind to localhost and
      # free host :443 by setting in .env:
      #   DESK_HTTP_BIND=127.0.0.1  DESK_HTTPS_BIND=127.0.0.1  DESK_HTTPS_PORT=8443
      - "${DESK_HTTP_BIND:-0.0.0.0}:${DESK_HTTP_PORT:-80}:80"
      - "${DESK_HTTPS_BIND:-0.0.0.0}:${DESK_HTTPS_PORT:-443}:443"
    volumes:
      - caddydata:/data # HTTPS certificates
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
