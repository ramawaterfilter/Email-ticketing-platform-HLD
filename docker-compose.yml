services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desk}
      POSTGRES_DB: desk
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped # must come back after a reboot, or the API has no database

  # The two services below only start with:  docker compose --profile app up -d --build
  # For day-to-day development just run the database:  docker compose up -d db
  api:
    profiles: ["app"]
    build: ./backend
    image: support-desk-backend # api and worker share one image, so the backend builds once
    env_file: .env
    environment:
      DESK_DATABASE_URL: postgresql+psycopg://desk:${POSTGRES_PASSWORD:-desk}@db:5432/desk
    depends_on:
      db:
        condition: service_healthy
    healthcheck: # "healthy" = migrations done, API answering, database reachable
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: support-desk-backend # reuses the image api builds (no second build)
    command: ["python", "-m", "app.worker"] # syncs mailboxes every 60s + nightly reconciliation
    env_file: .env
    environment:
      DESK_DATABASE_URL: postgresql+psycopg://desk:${POSTGRES_PASSWORD:-desk}@db:5432/desk
    depends_on:
      api:
        condition: service_healthy # api applies migrations first
    restart: unless-stopped

  web:
    profiles: ["app"]
    build: ./frontend
    environment:
      DESK_SITE_ADDRESS: ${DESK_SITE_ADDRESS:-:80}
    ports:
      - "${DESK_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - caddydata:/data # HTTPS certificates
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- DB monitoring tools ----
  # Start with:  docker compose --profile tools up -d
  # pgweb: browse tables + run SQL at http://localhost:8081
  pgweb:
    profiles: ["tools"]
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://desk:${POSTGRES_PASSWORD:-desk}@db:5432/desk?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081" # this machine only
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # metabase: charts + dashboards (ticket volume, SLA, AI usage) at http://localhost:3456
  metabase:
    profiles: ["tools"]
    image: metabase/metabase:latest
    ports:
      - "127.0.0.1:3456:3000" # host 3456 (3000/3001 taken); this machine only
    volumes:
      - metabasedata:/metabase-data # keeps dashboards across restarts (H2 app db)
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
  caddydata:
  metabasedata:
