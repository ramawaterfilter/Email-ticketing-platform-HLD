name: deploy

# Deploys on every push to main via a self-hosted runner that lives on the
# WSL server (outbound-only; no inbound ports, no SSH secrets).
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false   # never interrupt a deploy mid-build

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Pull latest and redeploy
        run: |
          set -euo pipefail
          cd "$HOME/support-desk"          # the live deploy dir (holds .env + volumes)
          git fetch origin main
          git reset --hard origin/main      # make the tree match main exactly
          docker compose --profile app build
          docker compose --profile app up -d
          docker image prune -f             # drop old layers so disk doesn't fill
